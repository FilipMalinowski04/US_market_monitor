{% load static %}
<!DOCTYPE html>
<html lang="pl" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}US Market Monitor{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'companies/css/theme.css' %}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-app mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'search' %}">US Market Monitor</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link {% if request.resolver_match.url_name == 'search' %}active{% endif %}"
                   href="{% url 'search' %}">Wyszukiwarka</a>
                <a class="nav-link {% if request.resolver_match.url_name == 'watchlist' %}active{% endif %}"
                   href="{% url 'watchlist' %}">
                    Obserwowane
                    <span class="nav-badge">{{ watchlist_count }}</span>
                </a>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
